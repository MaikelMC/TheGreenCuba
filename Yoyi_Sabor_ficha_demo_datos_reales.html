const INTRO_SHORT = "🍽️ ¡Delicias que enamoran! 🍽️ ¡Bienvenidos al paraíso de los sabores! 🌮🔥 Aquí encontrarás la…";
const WA = "5359004318";
const FID = {"metas":[{"premio":"Un agregado Gratis","sellos":5},{"premio":"2 agregados gratis","sellos":10},{"premio":"1 empanada gratis","sellos":15},{"premio":"Bolso Yoyi’Sabor","sellos":20}],"activo":true,"nombre":"Tarjeta de Fidelidad Yoyi’Sabor","compraMinima":{"monto":1000,"moneda":"CUP"}};
const DIR = "San Bartolomé #314 int entre San Germán y Trinidad, Santiago de Cuba";
const TIEMPO = "20–45 min";
const AGO_N = 29;

const st = { tab:'todo', cat:'Todas', qty:{}, introOpen:false, showAgot:false };
const fmt = (n)=> n.toLocaleString('es-ES').replace(/,/g,' ') + ' CUP';
const money = (n)=> new Intl.NumberFormat('es-ES').format(n).replace(/\./g,' ');
function tile(i){ return TILES[i % TILES.length]; }

function chips(list){ return list.map(s=>'<span style="display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--chipBg);color:var(--soft);font-family:\'Space Grotesk\',sans-serif;font-size:12px;font-weight:600">'+s+'</span>').join(''); }

const SERVICIOS = ['A domicilio','Pedidos por WhatsApp','Apartar por WhatsApp','Tarjeta de fidelidad','Funciona sin corriente'];

function resumenRow(svg, html){
  return '<div style="display:flex;gap:14px;align-items:flex-start"><svg style="flex-shrink:0;color:var(--soft)" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+svg+'</svg><div style="font-size:15px;line-height:1.4">'+html+'</div></div>';
}

  const q = st.qty[p.id]||0;

    : '<button data-add="'+p.id+'" data-d="1" aria-label="Añadir '+p.name+'" style="width:44px;height:44px;flex-shrink:0;border-radius:999px;border:none;background:#35AF6D;color:#052017;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button>';
  return '<div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)"><div style="width:56px;height:56px;border-radius:12px;background:'+tile(p._i)+';flex-shrink:0"></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><div style="font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+p.name+'</div><div style="font-size:13px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+(p.desc||p.cat)+'</div><div style="font-size:14px;font-weight:600">'+fmt(p.precio)+'</div></div>'+ctl+'</div>';
}

function panelTodo(){
  const rows =
    resumenRow('<circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>','<b style="color:var(--green600);font-weight:600">Abierto ahora</b> · '+"9:00 – 18:00") +
    resumenRow('<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"></path><circle cx="12" cy="10" r="3"></circle>', DIR) +
    resumenRow('<circle cx="5.5" cy="17.5" r="3.5"></circle><circle cx="18.5" cy="17.5" r="3.5"></circle><path d="M15 6h2l3 11.5"></path><path d="M5.5 17.5L9 9h6l-3 8.5"></path>','A domicilio en '+TIEMPO+' · envío a consultar por WhatsApp') +
    resumenRow('<rect x="2" y="6" width="20" height="13" rx="2"></rect><path d="M2 10h20"></path><path d="M6 15h4"></path>','Aceptan CUP, USD (efectivo) y transferencia') +
    resumenRow('<path d="M13 2L4 14h7l-1 8 9-12h-7z"></path>','Tiene planta: funciona sin corriente');
  const dest = PROD.slice(0,6).map(p=>{
    return '<div style="flex-shrink:0;width:150px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column"><div style="height:104px;background:'+tile(p._i)+'"></div><div style="padding:10px;display:flex;flex-direction:column;gap:4px"><div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+p.name+'</div><div style="font-size:13px;color:var(--soft)">'+fmt(p.precio)+'</div><button data-add="'+p.id+'" data-d="1" style="margin-top:4px;height:36px;border-radius:999px;border:1px solid var(--green200);background:var(--green50);color:var(--green700);font-family:\'Space Grotesk\',sans-serif;font-size:13px;font-weight:600;cursor:pointer">'+(st.qty[p.id]>0?('En tu pedido · '+st.qty[p.id]):'Añadir')+'</button></div></div>';
  }).join('');
  const prev = FOTOS.slice(0,6).map(u=>'<div class="ph" style="aspect-ratio:1;background-color:#5a3f27;background-image:url(\''+u+'\')"></div>').join('');
  return '<div style="padding:16px;display:flex;flex-direction:column;gap:16px">'+
    '<div style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px"><div style="display:flex;align-items:center;justify-content:space-between"><h2 style="margin:0;font-size:20px;font-weight:600">Resumen</h2><button data-ev="irInfo" style="min-height:44px;padding:0 4px;border:none;background:transparent;color:var(--green600);font-family:\'Space Grotesk\',sans-serif;font-size:14px;font-weight:600;cursor:pointer">Ver todo</button></div>'+rows+'<div style="display:flex;flex-wrap:wrap;gap:6px;padding-top:2px">'+chips(SERVICIOS)+'</div></div>'+
    '<div style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;align-items:center;justify-content:space-between"><h2 style="margin:0;font-size:20px;font-weight:600">Del menú</h2><button data-ev="irMenu" style="min-height:44px;padding:0 4px;border:none;background:transparent;color:var(--green600);font-family:\'Space Grotesk\',sans-serif;font-size:14px;font-weight:600;cursor:pointer">Ver menú</button></div><div class="sin-barra" style="display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px">'+dest+'</div></div>'+
    '<div style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;align-items:center;justify-content:space-between"><h2 style="margin:0;font-size:20px;font-weight:600">Fotos</h2><button data-ev="fotos" style="min-height:44px;padding:0 4px;border:none;background:transparent;color:var(--green600);font-family:\'Space Grotesk\',sans-serif;font-size:14px;font-weight:600;cursor:pointer">Ver las '+FOTOS.length+'</button></div><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;border-radius:16px;overflow:hidden">'+prev+'</div></div>'+
    '<div style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px"><div style="display:flex;align-items:center;justify-content:space-between"><h2 style="margin:0;font-size:20px;font-weight:600">Reseñas</h2><button data-ev="toast" data-msg="Se abriría el formulario de reseña" style="height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-family:\'Space Grotesk\',sans-serif;font-size:14px;font-weight:600;cursor:pointer">Opinar</button></div><div style="font-size:15px;font-weight:600">Todavía no hay reseñas</div><div style="font-size:14px;color:var(--soft)">Cuéntale a los demás cómo te pareció este lugar.</div></div>'+
  '</div>';
}

function panelMenu(){
  const list = PROD.filter(p=> st.cat==='Todas' || p.cat===st.cat);
  const cs = ['Todas'].concat(CATS).map(c=>{
    const sel = st.cat===c;
    return '<button data-cat="'+c+'" style="flex-shrink:0;height:40px;padding:0 16px;border-radius:999px;border:1px solid '+(sel?'var(--green200)':'var(--line2)')+';background:'+(sel?'var(--green50)':'var(--card)')+';color:'+(sel?'var(--green700)':'var(--ink)')+';font-family:\'Space Grotesk\',sans-serif;font-size:14px;font-weight:600;cursor:pointer">'+c+'</button>';
  }).join('');
  const rows = list.length ? list.map(menuRow).join('') : '<div style="padding:18px 14px;font-size:14px;color:var(--soft)">Hoy no queda nada de esta categoría.</div>';
  let ago = '';
  if(st.showAgot){
    ago = '<div style="background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;opacity:0.65">'+
      AGO.slice(0,8).map(a=>'<div style="display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)"><span style="font-size:14px;font-weight:600">'+a.name+'</span><span style="font-size:12px;font-weight:600;color:var(--red)">Agotado</span></div>').join('')+
      (AGO.length>8?'<div style="padding:12px 14px;font-size:13px;color:var(--soft)">y '+(AGO.length-8)+' productos más</div>':'')+'</div>';
  }
  return '<div style="padding:16px;display:flex;flex-direction:column;gap:12px">'+
    '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px"><h2 style="margin:0;font-size:20px;font-weight:600">Menú</h2><span style="font-size:12px;color:var(--soft)">'+PROD.length+' disponibles</span></div>'+
    '<div class="sin-barra" style="display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px">'+cs+'</div>'+
    '<div style="background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column">'+rows+'</div>'+
    '<button data-ev="toggleAgot" style="display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:0 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:\'Space Grotesk\',sans-serif;font-size:14px;font-weight:600;cursor:pointer"><span>Agotado por hoy · '+AGO_N+'</span><span style="color:var(--soft)">'+(st.showAgot?'Ocultar':'Ver')+'</span></button>'+ago+
  '</div>';
}

function panelFotos(){
  const g = FOTOS.map(u=>'<div class="ph" style="aspect-ratio:1;background-color:#5a3f27;background-image:url(\''+u+'\')"></div>').join('');
  return '<div style="padding:16px;display:flex;flex-direction:column;gap:12px"><h2 style="margin:0;font-size:20px;font-weight:600">Fotos · El local</h2><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;border-radius:16px;overflow:hidden">'+g+'</div></div>';
}

function panelResenas(){
  return '<div style="padding:16px"><div style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center"><svg style="color:var(--green600)" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg><div style="font-size:17px;font-weight:600">Todavía no hay reseñas</div><div style="font-size:14px;color:var(--soft);max-width:260px">Sé el primero en contar cómo te fue con Yoyi Sabor.</div><button data-ev="toast" data-msg="Se abriría el formulario de reseña" style="margin-top:6px;height:48px;padding:0 24px;border-radius:999px;border:none;background:#35AF6D;color:#052017;box-shadow:var(--halo);font-family:\'Space Grotesk\',sans-serif;font-size:15px;font-weight:600;cursor:pointer">Escribir una reseña</button></div></div>';
}

function panelInfo(){
  const pagos = '<span style="padding:4px 10px;border-radius:999px;border:1px solid var(--green200);background:var(--green50);color:var(--green700);font-family:\'Space Grotesk\',sans-serif;font-size:12px;font-weight:600">CUP</span><span style="padding:4px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--chipBg);color:var(--soft);font-family:\'Space Grotesk\',sans-serif;font-size:12px;font-weight:600">USD (efectivo)</span><span style="padding:4px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--chipBg);color:var(--soft);font-family:\'Space Grotesk\',sans-serif;font-size:12px;font-weight:600">Transferencia</span>';
  let fid = '';
  if(FID && FID.activo){
    const metas = FID.metas.map(m=>'<div style="display:flex;justify-content:space-between;gap:10px;font-size:14px"><span style="color:var(--soft)">'+m.sellos+' sellos</span><span style="font-weight:600">'+m.premio+'</span></div>').join('');
    const min = FID.compraMinima ? ('Un sello por cada compra desde '+money(FID.compraMinima.monto)+' '+FID.compraMinima.moneda+'.') : '';
    fid = '<div style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px"><div style="display:flex;align-items:center;gap:10px"><svg style="color:var(--green600)" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 10h18"></path></svg><h3 style="margin:0;font-size:16px;font-weight:600">'+FID.nombre+'</h3></div><div style="display:flex;flex-direction:column;gap:6px">'+metas+'</div>'+(min?'<div style="font-size:13px;color:var(--soft)">'+min+'</div>':'')+'</div>';
  }
  return '<div style="padding:16px;display:flex;flex-direction:column;gap:14px">'+
    '<div style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px"><h3 style="margin:0;font-size:16px;font-weight:600">Ubicación</h3><div style="height:120px;border-radius:12px;background:var(--chipBg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--soft);font-size:13px;font-weight:600">Mapa del lugar</div><div style="font-size:15px;line-height:1.4">'+DIR+'</div><button data-ev="toast" data-msg="Se abriría el mapa con la ruta" style="height:44px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-family:\'Space Grotesk\',sans-serif;font-size:14px;font-weight:600;cursor:pointer">Cómo llegar</button></div>'+
    '<div style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px"><h3 style="margin:0;font-size:16px;font-weight:600">Horario</h3><div style="font-size:15px"><b style="color:var(--green600);font-weight:600">Abierto ahora</b> · '+"9:00 – 18:00"+'</div></div>'+
    '<div style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px"><h3 style="margin:0;font-size:16px;font-weight:600">Pedidos a domicilio</h3><div style="display:flex;justify-content:space-between;font-size:14px"><span style="color:var(--soft)">Tiempo</span><span style="font-weight:600">'+TIEMPO+'</span></div><div style="display:flex;justify-content:space-between;font-size:14px"><span style="color:var(--soft)">Envío</span><span style="font-weight:600">A consultar por WhatsApp</span></div></div>'+
    fid+
    '<div style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px"><h3 style="margin:0;font-size:16px;font-weight:600">Contacto</h3><div style="display:flex;gap:8px"><a href="https://wa.me/'+WA+'" target="_blank" rel="noopener" style="flex:1;height:44px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-family:\'Space Grotesk\',sans-serif;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;text-decoration:none">WhatsApp</a><a href="tel:+'+WA+'" style="flex:1;height:44px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-family:\'Space Grotesk\',sans-serif;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;text-decoration:none">Llamar</a></div></div>'+
    '<div style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px"><h3 style="margin:0;font-size:16px;font-weight:600">Pagos y servicios</h3><div style="display:flex;flex-wrap:wrap;gap:6px">'+pagos+'</div><div style="display:flex;flex-wrap:wrap;gap:6px">'+chips(SERVICIOS)+'</div></div>'+
  '</div>';
}

const TABS = [['todo','Todo'],['menu','Menú'],['fotos','Fotos'],['resenas','Reseñas'],['info','Información']];
PROD.forEach((p,i)=> p._i=i);

function render(){
  document.getElementById('intro').textContent = st.introOpen ? INTRO_FULL : INTRO_SHORT;
  document.getElementById('introBtn').textContent = st.introOpen ? 'Ver menos' : 'Ver más';
  document.getElementById('tabs').innerHTML = TABS.map(d=>{
    const sel = st.tab===d[0];
    return '<button data-tab="'+d[0]+'" role="tab" aria-selected="'+sel+'" style="flex-shrink:0;height:40px;padding:0 16px;border-radius:999px;border:none;background:'+(sel?'var(--green50)':'transparent')+';color:'+(sel?'var(--green700)':'var(--soft)')+';font-family:\'Space Grotesk\',sans-serif;font-size:15px;font-weight:600;cursor:pointer">'+d[1]+'</button>';
  }).join('');
  const panels = { todo:panelTodo, menu:panelMenu, fotos:panelFotos, resenas:panelResenas, info:panelInfo };
  document.getElementById('panel').innerHTML = panels[st.tab]();
  let cuenta=0, total=0;
  for(const p of PROD){ const q=st.qty[p.id]||0; cuenta+=q; total+=q*p.precio; }
  const bar=document.getElementById('cartbar');
  if(cuenta>0){ bar.style.display='block'; document.getElementById('cartcount').textContent='Ver pedido · '+(cuenta===1?'1 producto':cuenta+' productos'); document.getElementById('carttotal').textContent=fmt(total); }
  else bar.style.display='none';
}

let toastT;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.style.display='flex'; clearTimeout(toastT); toastT=setTimeout(()=>el.style.display='none',3200); }

document.addEventListener('click',(e)=>{
  const t = e.target.closest('[data-tab],[data-cat],[data-add],[data-ev]');
  if(!t) return;
  if(t.dataset.tab){ st.tab=t.dataset.tab; st.showAgot=false; render(); return; }
  if(t.dataset.cat){ st.cat=t.dataset.cat; render(); return; }
  if(t.dataset.add){ const id=t.dataset.add; st.qty[id]=Math.max(0,(st.qty[id]||0)+Number(t.dataset.d)); render(); return; }
  const ev=t.dataset.ev;
  if(ev==='intro'){ st.introOpen=!st.introOpen; render(); }
  else if(ev==='irMenu'){ st.tab='menu'; render(); }
  else if(ev==='irInfo'){ st.tab='info'; render(); }
  else if(ev==='fotos'){ st.tab='fotos'; render(); }
  else if(ev==='toggleAgot'){ st.showAgot=!st.showAgot; render(); }
  else if(ev==='mas'){ document.getElementById('sheet').style.display='block'; }
  else if(ev==='cerrarMas'){ document.getElementById('sheet').style.display='none'; }
  else if(ev==='volver'){ toast('Volverías al mapa de La Verde'); }
  else if(ev==='compartir'){ toast('Enlace de la ficha copiado'); }
  else if(ev==='toast'){ document.getElementById('sheet').style.display='none'; toast(t.dataset.msg); }
  else if(ev==='enviar'){
    const items = PROD.filter(p=>st.qty[p.id]>0).map(p=> st.qty[p.id]+' x '+p.name+' ('+fmt(p.precio*st.qty[p.id])+')');
    let total=0; for(const p of PROD){ total += (st.qty[p.id]||0)*p.precio; }
    const texto = 'Hola Yoyi Sabor, quiero pedir:%0A'+items.join('%0A')+'%0A%0ATotal: '+fmt(total);
    window.open('https://wa.me/'+WA+'?text='+texto,'_blank');
  }
});
render();
</script>
</body></html>
